name: Veilbound quality checks

on:
  push:
    branches:
      - main
      - maintenance/veilbound-stability
  pull_request:
    branches:
      - main
      - maintenance/veilbound-stability

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Veilbound-Cards-main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Run regression tests
        run: bun run test
      - name: Build production bundle
        run: bun run build
      - name: Smoke-test production preview and PWA manifest
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/veilbound-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/veilbound-preview.html; then
              break
            fi
            sleep 1
          done
          grep -q 'Veilbound: Ashen Crown' /tmp/veilbound-preview.html
          curl --fail --silent http://127.0.0.1:4173/manifest.webmanifest > /tmp/veilbound-manifest.json
          grep -q 'Veilbound' /tmp/veilbound-manifest.json
          for asset in favicon-32x32.png apple-touch-icon.png icon.svg pwa-192x192.png pwa-512x512.png pwa-maskable-512x512.png; do
            curl --fail --silent --output /dev/null "http://127.0.0.1:4173/$asset"
          done
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false --legacy-peer-deps playwright
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile app flows
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/veilbound-e2e-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/e2e-smoke.mjs
